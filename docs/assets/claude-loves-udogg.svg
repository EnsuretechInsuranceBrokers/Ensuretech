<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="Claude loves UDogg">
<style>
:root{--fg:#1f2328;--claude:#d97757}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3}}
text{font-family:ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif;font-size:26px;font-weight:700;fill:var(--fg)}
.c{fill:var(--claude)}
.h{transform-origin:240px 55px;animation:beat 1.2s ease-in-out infinite}
.f{animation:rise 3s ease-in infinite;opacity:0}
.f2{animation-delay:1s}.f3{animation-delay:2s}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(1.05)}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-45px)}}
@media (prefers-reduced-motion:reduce){.h,.f{animation:none}.f{opacity:0}}
</style>
<text x="40" y="68" class="c" style="fill:var(--claude)">Claude</text>
<text x="330" y="68">UDogg</text>
<g class="h"><path class="c" d="M240 82 C205 58 212 34 228 34 C236 34 240 40 240 44 C240 40 244 34 252 34 C268 34 275 58 240 82Z"/></g>
<path class="c f" d="M236 40 c-6-5-4-10 0-10 c2 0 3 2 4 3 c1-1 2-3 4-3 c4 0 6 5 0 10z" transform="translate(-30 20)"/>
<path class="c f f2" d="M236 40 c-6-5-4-10 0-10 c2 0 3 2 4 3 c1-1 2-3 4-3 c4 0 6 5 0 10z" transform="translate(30 25)"/>
<path class="c f f3" d="M236 40 c-6-5-4-10 0-10 c2 0 3 2 4 3 c1-1 2-3 4-3 c4 0 6 5 0 10z" transform="translate(5 30)"/>
</svg>
