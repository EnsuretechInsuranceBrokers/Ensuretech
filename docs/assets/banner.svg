<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">Ensuretech</title>
  <desc id="d">Brokers, employers, TPAs and insurers feed one validated pipeline that produces priced, audited endorsements.</desc>
  <style>
    :root { --bg:#0b1220; --bg2:#111b30; --fg:#e8eefc; --mut:#8fa3c7; --acc:#38bdf8; --acc2:#34d399; --line:#2a3b5f; }
    @media (prefers-color-scheme: light) { :root { --bg:#f4f7fc; --bg2:#e6edf8; --fg:#0f1b33; --mut:#51638a; --acc:#0369a1; --acc2:#047857; --line:#b8c6e0; } }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .mut { fill: var(--mut); }
    .node { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .flow { fill: none; stroke: var(--acc); stroke-width: 2; stroke-dasharray: 6 10; animation: run 1.6s linear infinite; opacity: .85; }
    .flow2 { stroke: var(--acc2); animation-duration: 2.2s; }
    .core { fill: none; stroke: var(--acc); stroke-width: 2; }
    .ring { fill: none; stroke: var(--acc); stroke-width: 1.5; transform-origin: 640px 165px; animation: pulse 3s ease-out infinite; }
    .ring.b { animation-delay: 1.5s; }
    .dot { fill: var(--acc2); }
    @keyframes run { to { stroke-dashoffset: -64; } }
    @keyframes pulse { 0% { transform: scale(.55); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .ring { animation: none; } }
  </style>
  <rect width="1280" height="330" fill="var(--bg)"/>
  <g opacity=".5">
    <path d="M0 40H1280M0 100H1280M0 160H1280M0 220H1280M0 280H1280" stroke="var(--line)" stroke-width=".5"/>
    <path d="M160 0V330M320 0V330M480 0V330M640 0V330M800 0V330M960 0V330M1120 0V330" stroke="var(--line)" stroke-width=".5"/>
  </g>
  <!-- sources -->
  <g>
    <rect class="node" x="60" y="42" width="200" height="40" rx="8"/><text x="160" y="67" text-anchor="middle" font-size="16">Brokers</text>
    <rect class="node" x="60" y="104" width="200" height="40" rx="8"/><text x="160" y="129" text-anchor="middle" font-size="16">Employers and HR</text>
    <rect class="node" x="60" y="166" width="200" height="40" rx="8"/><text x="160" y="191" text-anchor="middle" font-size="16">TPAs</text>
    <rect class="node" x="60" y="228" width="200" height="40" rx="8"/><text x="160" y="253" text-anchor="middle" font-size="16">Insurers</text>
  </g>
  <!-- flows in -->
  <g>
    <path class="flow" d="M260 62C400 62 450 150 560 160"/>
    <path class="flow" d="M260 124C400 124 450 160 560 164"/>
    <path class="flow flow2" d="M260 186C400 186 450 172 560 168"/>
    <path class="flow flow2" d="M260 248C400 248 450 182 560 172"/>
  </g>
  <!-- core -->
  <circle class="ring" cx="640" cy="165" r="80"/><circle class="ring b" cx="640" cy="165" r="80"/>
  <circle class="node" cx="640" cy="165" r="74"/><circle class="core" cx="640" cy="165" r="74"/>
  <text x="640" y="160" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1">ENSURETECH</text>
  <text x="640" y="184" text-anchor="middle" font-size="11" class="mut" letter-spacing="2">ONBOARDING LAYER</text>
  <!-- flows out -->
  <g>
    <path class="flow" d="M720 160C830 150 880 62 1020 62"/>
    <path class="flow" d="M720 164C830 160 880 124 1020 124"/>
    <path class="flow flow2" d="M720 168C830 172 880 186 1020 186"/>
    <path class="flow flow2" d="M720 172C830 182 880 248 1020 248"/>
  </g>
  <!-- outputs -->
  <g>
    <rect class="node" x="1020" y="42" width="200" height="40" rx="8"/><text x="1120" y="67" text-anchor="middle" font-size="16">Validated once</text>
    <rect class="node" x="1020" y="104" width="200" height="40" rx="8"/><text x="1120" y="129" text-anchor="middle" font-size="16">Priced and checked</text>
    <rect class="node" x="1020" y="166" width="200" height="40" rx="8"/><text x="1120" y="191" text-anchor="middle" font-size="16">Audited end to end</text>
    <rect class="node" x="1020" y="228" width="200" height="40" rx="8"/><text x="1120" y="253" text-anchor="middle" font-size="16">Shared with every party</text>
  </g>
  <text x="640" y="312" text-anchor="middle" font-size="13" class="mut" letter-spacing="1">Group health insurance onboarding infrastructure</text>
</svg>
