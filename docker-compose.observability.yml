# Optional, development only: metrics and Kafka visibility next to the stack.   scripts/observability-up.sh   (writes the scrape token, then compose up)
#
#   Prometheus  http://localhost:9099   scrapes every Spring service's /actuator/prometheus with the read-only METRICS_TOKEN
#   Grafana     http://localhost:3000   admin / admin; the "Ensuretech services" dashboard is already loaded
#   Kafka UI    http://localhost:8088   topics, messages, consumer groups and their lag
#
# network_mode: host so the containers can reach the services, which listen on 127.0.0.1 only (that is deliberate: run.html §3). Linux, and Docker Desktop with
# host networking enabled (Settings > Resources > Network). Everything below binds to 127.0.0.1. Untested here (no Docker in the build sandbox): see docs/observability.md for the no-Docker route.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=127.0.0.1:9099", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/metrics-token:/etc/prometheus/metrics-token:ro
      - ./observability/flower-password:/etc/prometheus/flower-password:ro
  grafana:
    image: grafana/grafana-oss:11.3.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ensuretech.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    network_mode: host
    environment:
      SERVER_PORT: "8088"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092
      DYNAMIC_CONFIG_ENABLED: "false"
