spring:
  application:
    name: sheet-generator-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ensuretech}
    username: ${DATABASE_USER:ensuretech}
    password: ${DATABASE_PASSWORD:ensuretech}
  flyway:
    schemas: sheetgen
    default-schema: sheetgen
    create-schemas: true
  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:../identity-service/keys/jwt-public.pem}
    issuer: ${JWT_ISSUER:ensuretech-identity}
  policy-service:
    base-url: ${POLICY_SERVICE_URL:http://localhost:8082}
    timeout-seconds: 10
  sheets:
    max-families: ${SHEETS_MAX_FAMILIES:20000}
    max-rows-in-memory: 200000
