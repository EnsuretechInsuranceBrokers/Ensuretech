spring:
  application:
    name: billing-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ensuretech}
    username: ${DATABASE_USER:ensuretech}
    password: ${DATABASE_PASSWORD:ensuretech}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: billing
  flyway:
    schemas: billing
    default-schema: billing
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: billing-service
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:../identity-service/keys/jwt-public.pem}
    issuer: ${JWT_ISSUER:ensuretech-identity}
  grpc:
    port: ${GRPC_PORT:9091}
    enabled: ${GRPC_ENABLED:true}
  kafka:
    listener:
      enabled: ${KAFKA_LISTENER_ENABLED:true}
  cd:
    reservation-ttl-hours: ${CD_RESERVATION_TTL_HOURS:24}
    expiry-sweep-ms: ${CD_EXPIRY_SWEEP_MS:60000}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:5000}
      batch-size: 100
      max-retries: 5
