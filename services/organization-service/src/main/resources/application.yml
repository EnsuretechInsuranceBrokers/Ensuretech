spring:
  application:
    name: organization-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ensuretech}
    username: ${DATABASE_USER:ensuretech}
    password: ${DATABASE_PASSWORD:ensuretech}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: organization
  flyway:
    schemas: organization
    default-schema: organization
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  address: ${BIND_ADDRESS:127.0.0.1}   # listen on the private interface only; never 0.0.0.0 on a public network
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    connection-timeout: 10s
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump,scheduledtasks,prometheus     # all but health and prometheus need a SYSTEM token (the lock); never heapdump, env or shutdown
  endpoint:
    health:
      show-details: when-authorized
      roles: SYSTEM

app:
  jwt:
    # RS256 public key published by identity-service (PEM, X.509 SubjectPublicKeyInfo)
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:../identity-service/keys/jwt-public.pem}
    issuer: ${JWT_ISSUER:ensuretech-identity}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:5000}
      batch-size: 100
      max-retries: 5

gateway:
  secret: ${GATEWAY_SECRET:}                 # shared with the BFF (BFF_GATEWAY_SECRET), at least 32 random characters. The service refuses to start without it.
  metrics-token: ${METRICS_TOKEN:}               # bearer token for a metrics scraper on GET /actuator/prometheus only; blank = metrics closed
  allow-unguarded: ${GATEWAY_ALLOW_UNGUARDED:false}   # true = answer anyone who can reach the port. Local development only.
