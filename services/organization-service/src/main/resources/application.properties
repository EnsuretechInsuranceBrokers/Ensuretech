# Spring Boot Admin client: this service registers itself with the admin server (admin-service, http://127.0.0.1:8100) when ADMIN_CLIENT_ENABLED=true.
# Off by default, so a service never nags a server that is not there. The admin server calls this service's /actuator endpoints with a SYSTEM token (the lock admits nothing else).
spring.boot.admin.client.enabled=${ADMIN_CLIENT_ENABLED:false}
spring.boot.admin.client.url=${ADMIN_SERVER_URL:http://127.0.0.1:8100}
spring.boot.admin.client.username=${ADMIN_UI_USER:admin}
spring.boot.admin.client.password=${ADMIN_UI_PASSWORD:}
spring.boot.admin.client.instance.service-base-url=http://127.0.0.1:${server.port}
spring.boot.admin.client.instance.name=${spring.application.name}
